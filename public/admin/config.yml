backend:
  name: github
  repo: Bay-Pal/annur-website
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

publish_mode: editorial_workflow
site_url: "https://annurmw.com"
display_url: "https://annurmw.com"
logo_url: "/favicon.svg"

collections:
  - name: "impact_stories"
    label: "Impact Stories"
    label_singular: "Impact Story"
    folder: "content/impact-stories"
    create: true
    extension: "mdx"
    format: "frontmatter"
    slug: "{{slug}}"
    summary: "{{title}} · {{category}} · {{status}}"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "Use a human, story-led title rather than a report title." }
      - { label: "Slug", name: "slug", widget: "string", hint: "SEO-friendly URL, for example farmer-transformation-dwangwa." }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "One or two emotional sentences for listings and metadata." }
      - { label: "Featured Image", name: "featuredImage", widget: "image" }
      - { label: "Image Alt Text", name: "imageAlt", widget: "string", hint: "Describe the image for accessibility and SEO." }
      - label: "Gallery Images"
        name: "galleryImages"
        widget: "list"
        summary: "{{fields.alt}}"
        fields:
          - { label: "Image", name: "src", widget: "image" }
          - { label: "Alt Text", name: "alt", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Agriculture", "Education", "Orphan Care", "Women’s Empowerment", "Livestock", "Community Leadership"] }
      - { label: "Related Program", name: "relatedProgram", widget: "select", options: ["agriculture", "education", "orphan-care", "womens-empowerment", "livestock", "community-welfare"] }
      - { label: "Location", name: "location", widget: "string", default: "Central Region, Malawi" }
      - { label: "Beneficiary Name", name: "beneficiaryName", widget: "string", hint: "Use a real name only when consent is confirmed. Otherwise use a safe description." }
      - label: "Impact Metrics"
        name: "impactMetrics"
        widget: "list"
        fields:
          - { label: "Label", name: "label", widget: "string" }
          - { label: "Value", name: "value", widget: "string" }
      - { label: "Before Summary", name: "beforeSummary", widget: "text" }
      - { label: "After Summary", name: "afterSummary", widget: "text" }
      - { label: "Published Date", name: "publishedDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Updated Date", name: "updatedDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Featured Story", name: "featured", widget: "boolean", default: false }
      - { label: "Status", name: "status", widget: "select", options: ["draft", "published"], default: "draft" }
      - { label: "SEO Title", name: "seoTitle", widget: "string" }
      - { label: "SEO Description", name: "seoDescription", widget: "text" }
      - { label: "Open Graph Image", name: "openGraphImage", widget: "image" }
      - { label: "Tags", name: "tags", widget: "list", field: { label: "Tag", name: "tag", widget: "string" } }
      - { label: "Full Story Body", name: "body", widget: "markdown", hint: "Write this as a documentary story. Use headings sparingly." }
