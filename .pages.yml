media:
  - name: uploads
    input: public/uploads
    output: /uploads

content:
  - name: impact-stories
    label: Impact Stories
    type: collection
    path: content/impact-stories
    format: yaml-frontmatter
    view:
      fields: [title, category, publishedDate, status]
      primary: title
      sort:
        field: publishedDate
        order: desc
    fields:
      - name: title
        label: Story Title
        type: string
        required: true

      - name: slug
        label: URL Slug (e.g. farmer-transformation-dwangwa)
        type: string
        required: true

      - name: category
        label: Programme / Category
        type: select
        required: true
        options:
          values:
            - Agricultural Development
            - Education
            - Livestock Rotation Programme
            - Social Welfare
            - Economic Empowerment
            - Women's Empowerment
            - Islamic Center with Boarding Facilities
            - Community Welfare

      - name: excerpt
        label: Short Summary (1-2 sentences)
        type: string
        required: true

      - name: featuredImage
        label: Main Cover Photo (Hero Image)
        type: image
        options:
          media: uploads

      - name: galleryImages
        label: Project Photo Gallery (Multiple Carousel Images)
        type: image
        list: true
        options:
          media: uploads

      - name: body
        label: Story Narrative
        type: rich-text
        options:
          media: uploads

      - name: publishedDate
        label: Publish Date
        type: date

      - name: status
        label: Status
        type: select
        options:
          values:
            - published
            - draft
        default: published

      - name: featured
        label: Show on Homepage
        type: boolean
        default: false
